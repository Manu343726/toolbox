syntax = "proto3";

package toolbox.registry.v1;

option go_package = "github.com/Manu343726/toolbox/subsystems/registry/registryv1;registryv1";

// RegistryService stores and resolves running subsystem registrations.
service RegistryService {
  // @toolbox.side-effects create update
  // Register adds or replaces a subsystem registration.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // @toolbox.side-effects read_only
  // Heartbeat extends the lease for an existing registration.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // @toolbox.side-effects delete
  // Deregister removes a subsystem registration.
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  // @toolbox.side-effects read_only
  // GetService returns one registration by subsystem name.
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  // WatchServices streams registry changes as they happen.
  //
  // A registry a deployment can add to and remove from at runtime is only useful
  // to a client that learns about it while it runs. Polling answers the question
  // eventually and costs a round trip per attempt; a stream answers it once. A
  // resolver watching this stops resolving from a stale table, and a subsystem
  // watching it learns that a peer it depends on has gone before its next call
  // fails rather than after.
  //
  // The stream opens with a sync event carrying every current registration, so a
  // client is useful immediately rather than after the next change.
  //
  // A client that stops reading is disconnected rather than allowed to fall
  // behind: a silently dropped deregistration is worse than a broken stream,
  // because the client would go on believing a subsystem is still there.
  //
  // @toolbox.side-effects read_only
  rpc WatchServices(WatchServicesRequest) returns (stream RegistryEvent);
  // @toolbox.side-effects read_only
  // ListServices returns registrations matching the supplied filters.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
}

// RegistryEventType states what happened to a registration.
enum RegistryEventType {
  // No event type was supplied.
  REGISTRY_EVENT_TYPE_UNSPECIFIED = 0;
  // The current set of registrations, sent once when a watch opens.
  REGISTRY_EVENT_TYPE_SYNC = 1;
  // A subsystem registered.
  REGISTRY_EVENT_TYPE_REGISTERED = 2;
  // An existing registration was replaced, which is how a subsystem that moved to
  // a new endpoint announces itself.
  REGISTRY_EVENT_TYPE_UPDATED = 3;
  // A lease was extended. It carries no change in reachability, and a client that
  // only cares about membership may ignore it.
  REGISTRY_EVENT_TYPE_HEARTBEAT = 4;
  // A registration was removed, either by an explicit deregistration or by a lease
  // lapsing.
  REGISTRY_EVENT_TYPE_DEREGISTERED = 5;
}

// WatchServicesRequest asks for registry changes.
message WatchServicesRequest {
  // Report only changes to this subsystem. Empty reports every subsystem.
  string subsystem_name = 1;
  // Skip the opening sync event. It is false by default, because a client that
  // learns nothing until the next change is a client that cannot answer a question
  // asked in the meantime.
  bool skip_initial_sync = 2;
}

// RegistryEvent is one change to the registry.
message RegistryEvent {
  // What happened.
  RegistryEventType type = 1;
  // The registration this event is about. Absent on a sync event.
  ServiceDescriptor descriptor = 2;
  // Every active registration. On a sync event only.
  repeated ServiceDescriptor services = 3;
}

// RegistryStatus is the lifecycle state of a registered subsystem.
enum RegistryStatus {
  // No status was supplied.
  REGISTRY_STATUS_UNSPECIFIED = 0;
  // The subsystem is starting.
  REGISTRY_STATUS_STARTING = 1;
  // The subsystem is ready to serve requests.
  REGISTRY_STATUS_SERVING = 2;
  // The subsystem is not ready.
  REGISTRY_STATUS_NOT_SERVING = 3;
  // The subsystem is draining before shutdown.
  REGISTRY_STATUS_DRAINING = 4;
}

// Capability is a semantic operation intentionally exposed by a subsystem.
message Capability {
  // Stable capability name, such as knowledge.search.
  string name = 1;
  // Human-readable capability description.
  string description = 2;
  // Permission scopes required to invoke the capability.
  repeated string required_permissions = 3;
}

// ServiceDescriptor is the registry representation of one running subsystem.
message ServiceDescriptor {
  // Stable subsystem name, unique within a registry.
  string subsystem_name = 1;
  // Base HTTP endpoint exposing ConnectRPC services.
  string endpoint = 2;
  // Implementation version.
  string implementation_version = 3;
  // API contract version.
  string api_version = 4;
  // Fully-qualified protobuf service names mounted by the subsystem.
  repeated string service_names = 5;
  // Capabilities intentionally exposed by the subsystem.
  repeated Capability capabilities = 6;
  // Subsystem or capability dependencies.
  repeated string dependencies = 7;
  // Human-readable description.
  string description = 8;
  // Registration time as Unix nanoseconds since the epoch.
  int64 registered_at_unix_nano = 9;
  // Lease expiration as Unix nanoseconds since the epoch. Zero means no lease.
  int64 lease_expires_at_unix_nano = 10;
  // Current lifecycle status.
  RegistryStatus status = 11;
}

// RegisterRequest registers a subsystem.
message RegisterRequest {
  // Descriptor to store.
  ServiceDescriptor descriptor = 1;
  // Lease duration in seconds. Zero uses the registry default.
  int64 lease_seconds = 2;
}

// RegisterResponse acknowledges a registration.
message RegisterResponse {
  // Stored descriptor after defaults and timestamps are applied.
  ServiceDescriptor descriptor = 1;
}

// HeartbeatRequest extends a registration lease.
message HeartbeatRequest {
  // Subsystem name whose lease should be extended.
  string subsystem_name = 1;
  // New lease duration in seconds. Zero uses the registry default.
  int64 lease_seconds = 2;
}

// HeartbeatResponse returns the updated descriptor.
message HeartbeatResponse {
  // Updated descriptor.
  ServiceDescriptor descriptor = 1;
}

// DeregisterRequest removes a registration.
message DeregisterRequest {
  // Subsystem name to remove.
  string subsystem_name = 1;
}

// DeregisterResponse acknowledges removal.
message DeregisterResponse {
  // True when a registration was removed.
  bool removed = 1;
}

// GetServiceRequest looks up one subsystem.
message GetServiceRequest {
  // Subsystem name to retrieve.
  string subsystem_name = 1;
}

// GetServiceResponse contains one registration.
message GetServiceResponse {
  // Matching descriptor.
  ServiceDescriptor descriptor = 1;
}

// ListServicesRequest filters registry entries.
message ListServicesRequest {
  // Return only this subsystem name when non-empty.
  string subsystem_name = 1;
  // Return only entries exposing all listed capabilities.
  repeated string required_capabilities = 2;
  // Include entries whose lease has expired.
  bool include_expired = 3;
}

// ListServicesResponse contains matching registrations.
message ListServicesResponse {
  // Matching descriptors sorted by subsystem name.
  repeated ServiceDescriptor services = 1;
}
