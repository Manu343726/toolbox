syntax = "proto3";

package toolbox.logger.v1;

option go_package = "github.com/Manu343726/toolbox/subsystems/logger/loggerv1;loggerv1";

// LoggerService exposes a deployment's log fanout to callers that are not
// this process, so an agent or a service it started can send entries
// through the same routes the rest of the deployment uses.
//
// The fanout itself is not configurable here for a running deployment. The
// sinks a deployment has and the routes between them belong to its
// configuration file; this service reads that file, reports it, and
// accepts entries. What an entry reaches is decided by the deployment,
// not by the caller.
service LoggerService {
  // @toolbox.side-effects read_only
  // GetConfig returns the deployment's fanout as it is currently
  // configured: its minimum level, the sinks it has, the routes between
  // them, and which project the answers are about.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // @toolbox.side-effects writes_state
  // SetConfig declares the project a caller is acting for, and optionally
  // the fanout for the entries it sends as that project.
  //
  // The two are separate on purpose. Naming a project is what lets a route
  // tell which entries are that project's; supplying a fanout is how a
  // client redirects its own, and it is scoped to that project.
  //
  // The scope is the whole point and is not negotiable over the wire. What
  // a caller sets here applies to entries tagged with this workspace and to
  // nothing else, so a caller configuring its own logging cannot redirect
  // the deployment's own entries, or another project's. There is no request
  // that changes the deployment's fanout: that is the configuration file's.
  //
  // A caller that supplies no fanout is only naming its project, which is
  // what a caller with a project but no opinions about its routing wants.
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);

  // @toolbox.side-effects writes_state
  // Log records one entry.
  //
  // The entry reaches every route that matches it, which is the same
  // answer an in-process slog call gets. An entry that matches no route
  // is not an error: it was recorded by nobody because nothing asked for
  // it, and the count of those is reported by GetConfig.
  rpc Log(LogRequest) returns (LogResponse);
}

// LogLevel is a severity, ordered from most to least verbose.
enum LogLevel {
  // No level was supplied. The entry is treated as info.
  LOG_LEVEL_UNSPECIFIED = 0;
  // Fine-grained detail, off unless a deployment asked for it.
  LOG_LEVEL_DEBUG = 1;
  // Normal progress.
  LOG_LEVEL_INFO = 2;
  // Something is wrong but the work continued.
  LOG_LEVEL_WARN = 3;
  // Something failed.
  LOG_LEVEL_ERROR = 4;
}

// LogValue is one attribute on an entry.
//
// A string message with key/value pairs is the shape the standard
// library's structured logging has, and a caller that had to flatten its
// own attributes into a string to send them would have to parse them
// again on the other side.
message LogValue {
  // The attribute's key.
  string key = 1;
  // The attribute's value, rendered as text.
  //
  // It is text because a log entry is read by people and by systems that
  // each want their own types, and because the standard library renders
  // any value as text when a sink is text.
  string value = 2;
}

// FanoutSource says where a reported fanout came from.
enum FanoutSource {
  // No source was determined.
  FANOUT_SOURCE_UNSPECIFIED = 0;
  // The deployment's own configuration file, which is the only thing that
  // may state the deployment's fanout.
  FANOUT_SOURCE_DEPLOYMENT = 1;
  // The configuration file of the project named in the request, found by
  // walking up from the directory the caller named.
  FANOUT_SOURCE_PROJECT_FILE = 2;
  // A fanout a caller supplied for its own workspace, through SetConfig.
  FANOUT_SOURCE_CALLER = 3;
}

// LogHandler declares one sink in a fanout. It is used in both directions:
// a deployment reports its sinks with it, and a caller states its own with
// it.
message LogHandler {
  // The name routes refer to this sink by.
  string name = 1;
  // The backend that produces it, such as text, json, null or logfile.
  string provider = 2;
  // The minimum severity this sink receives.
  LogLevel level = 3;
  // The backend's own settings, which are the provider's business.
  map<string, string> options = 4;
}

// LogRoute describes one way entries reach sinks. It is used in both
// directions, and a route a caller supplies is reached only by entries
// carrying the caller's own workspace.
message LogRoute {
  // The route's name, for a diagnostic.
  string name = 1;
  // The minimum severity an entry must reach to match, or unspecified
  // when the route said none.
  LogLevel level = 2;
  // Attributes an entry must carry to match, as key/value pairs.
  map<string, string> attributes = 3;
  // The names of the sinks this route sends to.
  repeated string handlers = 4;
  // Attributes attached to whatever the route matches.
  map<string, string> add = 5;
}

// GetConfigRequest asks for a deployment's fanout.
message GetConfigRequest {
  // The project whose fanout is wanted, which is the deployment's own
  // when empty.
  //
  // A project may be given its own configuration file, so the answer is
  // the fanout that project would actually log into.
  string workspace = 1;
}

// GetConfigResponse describes a deployment's fanout.
message GetConfigResponse {
  // The minimum severity an entry must reach to be routed at all.
  LogLevel level = 1;
  // Where this fanout came from, so a caller can tell its own configuration
  // from its project's file and from the deployment's.
  FanoutSource source = 8;
  // The sinks, in a stable order.
  repeated LogHandler handlers = 2;
  // The delivery plan, in order.
  repeated LogRoute routes = 3;
  // The project this fanout belongs to, empty for the deployment's own.
  string workspace = 4;
  // The backends this deployment can name, so a caller asking to send
  // somewhere can find out where it may send.
  repeated string providers = 5;
  // How many entries a sink refused to write.
  int64 failures = 6;
  // How many entries matched no route and reached no sink.
  int64 unrouted = 7;
}

// SetConfigRequest declares the project a caller is acting for.
message SetConfigRequest {
  // The project the caller is acting for, and the workspace the fanout
  // below is scoped to.
  string workspace = 1;
  // The minimum severity an entry from this workspace must reach to be
  // routed at all. Left unspecified, the deployment's own minimum applies.
  LogLevel level = 2;
  // The sinks for this workspace's entries, in the order they are declared.
  //
  // A backend the deployment does not have is refused, so a caller cannot
  // route to a sink that was never part of this installation.
  repeated LogHandler handlers = 3;
  // The delivery plan for this workspace's entries, in order. Every route
  // that matches contributes, as it does for the deployment's own.
  repeated LogRoute routes = 4;
}

// SetConfigResponse confirms the project a caller is acting for.
message SetConfigResponse {
  // The project recorded, which is what later entries are tagged with.
  string workspace = 1;
  // The fanout now in effect for this project, which is the one supplied
  // here when there was one and the project's own otherwise.
  //
  // It is reported rather than assumed, so a caller can see where its
  // entries will go instead of finding out from a log it cannot read.
  LogLevel level = 2;
  // The sinks in effect for this project.
  repeated LogHandler handlers = 3;
  // The delivery plan in effect for this project.
  repeated LogRoute routes = 4;
  // Where that fanout came from.
  FanoutSource source = 5;
  // Whether this call supplied a fanout or only named the project, so a
  // caller that sent an empty configuration is not left thinking it did.
  bool configured = 6;
}

// LogRequest is one entry.
message LogRequest {
  // The message a person reads.
  string message = 1;
  // The entry's severity, treated as info when unspecified.
  LogLevel level = 2;
  // The entry's attributes, in the order the caller sent them.
  repeated LogValue attributes = 3;
  // The project the entry belongs to, which is the caller's recorded
  // project when empty.
  string workspace = 4;
  // The component that produced the entry, which is the attribute routes
  // most often match on.
  string logger = 5;
}

// LogResponse reports what happened to one entry.
message LogResponse {
  // Whether the entry reached at least one sink.
  bool routed = 1;
  // The names of the sinks it reached, so a caller can see where its
  // entry went without reading the deployment's logs.
  repeated string handlers = 2;
}
