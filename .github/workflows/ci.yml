name: CI

# The checks that run on every push. What they have in common is that each one catches a
# class of mistake that is invisible until someone runs the suite by hand: a subsystem that no
# longer builds on its own, a generated file that drifted from its .proto, a formatting change
# that arrived with a behaviour change in the same commit.
#
# The Makefile targets are the project's own. AGENTS.md requires `make test` and `make vet`
# before a change is considered done, and this workflow runs exactly those rather than a
# paraphrase of them — a CI check that is not the documented check is a second thing to keep
# in step with the first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is wasted compute, and the useful signal is the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Go 1.27 is what every module declares, and a toolchain that does not match the go
  # directive is a toolchain that silently rewrites files.
  GO_VERSION: "1.27"

jobs:
  # The gate. Everything else is a faster, more specific version of something this catches.
  verify:
    name: test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          set -euo pipefail
          # Generated Go is gitignored, so a checkout has none of it and nothing compiles until
          # this has run. protoc itself is installed rather than assumed: GitHub's runner image
          # carries it today, and a step that depends on what the image happens to include is a
          # step that breaks when the image changes. The version is pinned so a regenerated
          # descriptor is identical from one run to the next.
          PROTOC_VERSION=36.2
          case "$(uname -m)" in
            x86_64)  target=linux-x86_64 ;;
            aarch64) target=linux-aarch_64 ;;
            *) echo "no protoc build for $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${target}.zip"
          curl -fsSL --retry 3 -o /tmp/protoc.zip "$url"
          rm -rf /tmp/protoc && unzip -q -o -d /tmp/protoc /tmp/protoc.zip
          chmod +x /tmp/protoc/bin/protoc
          # Put it on PATH for this step's shell, because $GITHUB_PATH only takes effect for
          # the steps that follow. The line is still written so a later step and a person
          # reading the log can both see where protoc came from.
          export PATH="/tmp/protoc/bin:$PATH"
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Build every subsystem and the host
        run: make build

      - name: Vet every module
        run: make vet

      - name: Test every module
        run: make test

      - name: The faster suite, which must agree with the full one
        run: make test-short

  # A subsystem is an independent project. Testing it inside the workspace proves it composes;
  # testing it with the workspace disabled proves it stands alone, which is the property the
  # whole module layout exists for and the one a workspace test cannot see.
  independent:
    name: independent module (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure in one subsystem says nothing about the others, so they run in parallel and
      # report separately. Cancelled rather than queued: a red sibling is not a reason to wait.
      fail-fast: false
      matrix:
        module:
          - subsystems/agent
          - subsystems/apigrpc
          - subsystems/apimcp
          - subsystems/apiopenapi
          - subsystems/apitools
          - subsystems/documentation
          - subsystems/health
          - subsystems/knowledge
          - subsystems/logfile
          - subsystems/logger
          - subsystems/model
          - subsystems/policy
          - subsystems/prompt
          - subsystems/registry
          - subsystems/skill
          - subsystems/testecho
          - subsystems/tool
          - subsystems/workflow
          - cmd/toolbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          set -euo pipefail
          # Generated Go is gitignored, so a checkout has none of it and nothing compiles until
          # this has run. protoc itself is installed rather than assumed: GitHub's runner image
          # carries it today, and a step that depends on what the image happens to include is a
          # step that breaks when the image changes. The version is pinned so a regenerated
          # descriptor is identical from one run to the next.
          PROTOC_VERSION=36.2
          case "$(uname -m)" in
            x86_64)  target=linux-x86_64 ;;
            aarch64) target=linux-aarch_64 ;;
            *) echo "no protoc build for $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${target}.zip"
          curl -fsSL --retry 3 -o /tmp/protoc.zip "$url"
          rm -rf /tmp/protoc && unzip -q -o -d /tmp/protoc /tmp/protoc.zip
          chmod +x /tmp/protoc/bin/protoc
          # Put it on PATH for this step's shell, because $GITHUB_PATH only takes effect for
          # the steps that follow. The line is still written so a later step and a person
          # reading the log can both see where protoc came from.
          export PATH="/tmp/protoc/bin:$PATH"
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate every contract
        # This module's own is not enough, and the reason is the thing this job exists to
        # check. A subsystem imports the root module and the registry, through `replace`
        # directives pointing at the directories beside it — which is what makes an
        # independent module possible at all. Those dependencies are gitignored generated
        # code, so on a checkout the module under test compiles against a root module and
        # a registry that have no apiv1 and no registryv1, and the failure reads as a
        # missing dependency rather than as the missing generation that caused it.
        #
        # Generating everything is also what GOWORK=off requires to be meaningful: the
        # point is that the module resolves its dependencies to the local directories
        # rather than to published versions, and that is only a claim worth testing when
        # those directories hold their generated code.
        run: make proto subsystems-proto

      - name: Test with the workspace disabled
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go test -count=1 ./...

      - name: Vet with the workspace disabled
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Its shape, which its own build cannot see
        # A Go file whose package clause does not match its directory's is listed by
        # Go under IgnoredGoFiles and never compiled, so the module builds, the module's
        # tests pass, and the file has never run. This is the job that asserts the module
        # stands alone, and a file the toolchain skips is not standing alone in any sense
        # that matters. The check belongs to the root module and reads files rather than
        # building, so it is pointed at this module with REPOCHECK_ROOT.
        env:
          REPOCHECK_ROOT: ${{ matrix.module }}
        run: go test -count=1 ./internal/repocheck

  # A shared-state bug is a bug that only appears under load, and it is the class most likely
  # to be introduced by a change that looks like a refactor.
  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          set -euo pipefail
          # Generated Go is gitignored, so a checkout has none of it and nothing compiles until
          # this has run. protoc itself is installed rather than assumed: GitHub's runner image
          # carries it today, and a step that depends on what the image happens to include is a
          # step that breaks when the image changes. The version is pinned so a regenerated
          # descriptor is identical from one run to the next.
          PROTOC_VERSION=36.2
          case "$(uname -m)" in
            x86_64)  target=linux-x86_64 ;;
            aarch64) target=linux-aarch_64 ;;
            *) echo "no protoc build for $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${target}.zip"
          curl -fsSL --retry 3 -o /tmp/protoc.zip "$url"
          rm -rf /tmp/protoc && unzip -q -o -d /tmp/protoc /tmp/protoc.zip
          chmod +x /tmp/protoc/bin/protoc
          # Put it on PATH for this step's shell, because $GITHUB_PATH only takes effect for
          # the steps that follow. The line is still written so a later step and a person
          # reading the log can both see where protoc came from.
          export PATH="/tmp/protoc/bin:$PATH"
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate every contract
        # The root packages import apiv1, which is generated and gitignored, so a
        # checkout cannot compile them until protoc has run. This job is about
        # concurrency rather than about generation, but it still has to generate.
        run: make proto subsystems-proto

      - name: The whole framework under the race detector
        # AGENTS.md requires `go test -race ./...` for a change to shared
        # concurrency, and the packages below are named only because they are where
        # a race would hurt. This runs the rest, so a lock added to a package nobody
        # thought of as shared is still covered by the run that is always on rather
        # than by remembering to add a name to a list.
        run: go test -race -count=1 ./...

      - name: The packages that hold shared state, twice over
        # pkg/log holds the router every entry passes through, pkg/mcp the exposure state
        # every tool reads, and pkg/host the host that composes them. Those three are where
        # a concurrency bug would live, and -count=2 because a race that appears once in two
        # runs appears in neither half the time.
        run: go test -race -count=2 ./pkg/log ./pkg/mcp ./pkg/host

      - name: The logger subsystem under the race detector
        working-directory: subsystems/logger
        env:
          GOWORK: "off"
        # It caches a router per workspace behind a mutex, which is exactly the shape a race
        # hides in, and AGENTS.md requires the race suite for changes to shared concurrency.
        run: go test -race -count=2 ./...

  # Generated Go is gitignored, so it cannot be committed — which means it also cannot be
  # diffed. This regenerates it and checks that the .proto files and the toolchain still produce
  # what the tree expects, which is how a contract change that was not regenerated is caught.
  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          set -euo pipefail
          # Generated Go is gitignored, so a checkout has none of it and nothing compiles until
          # this has run. protoc itself is installed rather than assumed: GitHub's runner image
          # carries it today, and a step that depends on what the image happens to include is a
          # step that breaks when the image changes. The version is pinned so a regenerated
          # descriptor is identical from one run to the next.
          PROTOC_VERSION=36.2
          case "$(uname -m)" in
            x86_64)  target=linux-x86_64 ;;
            aarch64) target=linux-aarch_64 ;;
            *) echo "no protoc build for $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${target}.zip"
          curl -fsSL --retry 3 -o /tmp/protoc.zip "$url"
          rm -rf /tmp/protoc && unzip -q -o -d /tmp/protoc /tmp/protoc.zip
          chmod +x /tmp/protoc/bin/protoc
          # Put it on PATH for this step's shell, because $GITHUB_PATH only takes effect for
          # the steps that follow. The line is still written so a later step and a person
          # reading the log can both see where protoc came from.
          export PATH="/tmp/protoc/bin:$PATH"
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate the framework's own contract
        run: make proto

      - name: Generate every subsystem's contract
        run: |
          for subsystem in subsystems/*/; do
            if [ -d "$subsystem/proto" ]; then
              make -C "$subsystem" proto
            fi
          done

      - name: The generated code compiles and its descriptors parse
        # pkg/docs reads the descriptor sets the generation just produced. If a comment were
        # placed where the parser does not expect it, this is where it would be found — and the
        # failure would otherwise be a documentation command that quietly says less.
        run: go build ./... && go test ./pkg/docs ./pkg/cli

      - name: go.mod files are tidy
        # A module that does not build on its own is not an independent project, and the usual
        # cause is a requirement that was added to the workspace and never to the module.
        #
        # This is here rather than in the hygiene job because it cannot run before generation:
        # `go mod tidy` resolves the imports it finds, and a checkout has no apiv1 or skillv1
        # until protoc has run, so tidying there reports a module untidy for the one reason it
        # cannot be judged. It is the same check either way — this is the only place the
        # generated code exists.
        run: |
          for module in . cmd/toolbox subsystems/*/; do
            if [ -f "$module/go.mod" ]; then
              ( cd "$module" && GOWORK=off go mod tidy && git diff --quiet -- go.mod go.sum || {
                echo "$module/go.mod is not tidy; run 'go mod tidy' in it"
                git diff -- go.mod go.sum
                exit 1; } )
            fi
          done

  # Cheap, and it catches the two things that are always in the diff by accident: a file
  # gofmt would change, and a generated artifact or binary that should never be staged.
  hygiene:
    name: formatting and staged files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . 2>/dev/null | grep -v '^bin/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            echo "run 'make fmt'"
            exit 1
          fi

      - name: No generated artifact is tracked
        run: |
          # Generated Go, descriptor sets and binaries are gitignored by design, so one being
          # tracked means a .gitignore that was edited rather than honoured.
          tracked=$(git ls-files | grep -E '\.pb\.go$|/connect\.go$|\.pb$|(^|/)bin/' || true)
          if [ -n "$tracked" ]; then
            echo "these generated artifacts are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Every Go file is one the toolchain compiles, and no build output is tracked
        # Three mistakes that produce no error at all, which is why they are checks rather
        # than conventions.
        #
        # A Go file whose package clause does not match its directory's is not an error: Go
        # lists it under IgnoredGoFiles and carries on, so the build passes and the file has
        # never run. The documentation subsystem's docs_embed.go declared `package
        # documentation` in a package called `docs` and was skipped for its whole life, which
        # is how a subsystem whose only job is serving documentation served nothing.
        #
        # A build output is not source. `go build .` writes a binary named after the module
        # into that module's own directory, so a rule about which paths hold builds goes stale
        # with every subsystem; this asks git what it is tracking and reads the first bytes.
        # One 30MB ELF binary at the repository root was committed before this check existed.
        #
        # The CI matrix is a hand-written list, and a subsystem that is not on it is never
        # tested on its own by anything while every job still reports green.
        #
        # Reading the magic numbers in Go rather than through `file` keeps the answer
        # independent of what the runner has installed.
        run: go test -count=1 ./internal/repocheck
