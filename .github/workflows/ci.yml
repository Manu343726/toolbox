name: CI

# The checks that run on every push. What they have in common is that each one catches a
# class of mistake that is invisible until someone runs the suite by hand: a subsystem that no
# longer builds on its own, a generated file that drifted from its .proto, a formatting change
# that arrived with a behaviour change in the same commit.
#
# The Makefile targets are the project's own. AGENTS.md requires `make test` and `make vet`
# before a change is considered done, and this workflow runs exactly those rather than a
# paraphrase of them — a CI check that is not the documented check is a second thing to keep
# in step with the first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is wasted compute, and the useful signal is the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Go 1.27 is what every module declares, and a toolchain that does not match the go
  # directive is a toolchain that silently rewrites files.
  GO_VERSION: "1.27"

jobs:
  # The gate. Everything else is a faster, more specific version of something this catches.
  verify:
    name: test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        # The descriptor sets pkg/docs parses are generated by every subsystem's Makefile, and
        # they are gitignored, so a checkout has no generated code at all until these exist.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Build every subsystem and the host
        run: make build

      - name: Vet every module
        run: make vet

      - name: Test every module
        run: make test

      - name: The faster suite, which must agree with the full one
        run: make test-short

  # A subsystem is an independent project. Testing it inside the workspace proves it composes;
  # testing it with the workspace disabled proves it stands alone, which is the property the
  # whole module layout exists for and the one a workspace test cannot see.
  independent:
    name: independent module (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure in one subsystem says nothing about the others, so they run in parallel and
      # report separately. Cancelled rather than queued: a red sibling is not a reason to wait.
      fail-fast: false
      matrix:
        module:
          - subsystems/agent
          - subsystems/apigrpc
          - subsystems/apimcp
          - subsystems/apiopenapi
          - subsystems/apitools
          - subsystems/documentation
          - subsystems/health
          - subsystems/knowledge
          - subsystems/logfile
          - subsystems/logger
          - subsystems/model
          - subsystems/policy
          - subsystems/prompt
          - subsystems/registry
          - subsystems/skill
          - subsystems/testecho
          - subsystems/tool
          - subsystems/workflow
          - cmd/toolbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate its own protobuf artifacts
        working-directory: ${{ matrix.module }}
        # Generated code is gitignored, so this module has none until it is generated. Without
        # it the module does not compile and the failure looks like a source error.
        run: make proto

      - name: Test with the workspace disabled
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go test -count=1 ./...

      - name: Vet with the workspace disabled
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go vet ./...

  # A shared-state bug is a bug that only appears under load, and it is the class most likely
  # to be introduced by a change that looks like a refactor.
  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: The packages that hold shared state
        # pkg/log holds the router every entry passes through, pkg/mcp the exposure state every
        # tool reads, and cmd/toolbox the host that composes them. Those three are where a
        # concurrency bug would live.
        run: go test -race -count=2 ./pkg/log ./pkg/mcp ./pkg/host

      - name: The logger subsystem under the race detector
        working-directory: subsystems/logger
        env:
          GOWORK: "off"
        # It caches a router per workspace behind a mutex, which is exactly the shape a race
        # hides in, and AGENTS.md requires the race suite for changes to shared concurrency.
        run: go test -race -count=2 ./...

  # Generated Go is gitignored, so it cannot be committed — which means it also cannot be
  # diffed. This regenerates it and checks that the .proto files and the toolchain still produce
  # what the tree expects, which is how a contract change that was not regenerated is caught.
  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the protobuf toolchain
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate the framework's own contract
        run: make proto

      - name: Generate every subsystem's contract
        run: |
          for subsystem in subsystems/*/; do
            if [ -d "$subsystem/proto" ]; then
              make -C "$subsystem" proto
            fi
          done

      - name: The generated code compiles and its descriptors parse
        # pkg/docs reads the descriptor sets the generation just produced. If a comment were
        # placed where the parser does not expect it, this is where it would be found — and the
        # failure would otherwise be a documentation command that quietly says less.
        run: go build ./... && go test ./pkg/docs ./pkg/cli

  # Cheap, and it catches the two things that are always in the diff by accident: a file
  # gofmt would change, and a generated artifact or binary that should never be staged.
  hygiene:
    name: formatting and staged files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . 2>/dev/null | grep -v '^bin/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            echo "run 'make fmt'"
            exit 1
          fi

      - name: No generated artifact is tracked
        run: |
          # Generated Go, descriptor sets and binaries are gitignored by design, so one being
          # tracked means a .gitignore that was edited rather than honoured.
          tracked=$(git ls-files | grep -E '\.pb\.go$|/connect\.go$|\.pb$|(^|/)bin/' || true)
          if [ -n "$tracked" ]; then
            echo "these generated artifacts are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: No tracked file is a build output
        run: |
          # The rule above knows the names it is looking for. This knows what a file is, which
          # is the only way to catch the rest: `go build .` writes a binary named after the
          # module into that module's own directory, so the name to forbid changes with every
          # subsystem. One was committed before this check existed — 30MB of ELF at the
          # repository root.
          #
          # The media types are matched loosely, on "executable" and "octet-stream", because
          # `file` distinguishes application/x-executable from application/x-pie-executable and
          # a PIE is the default on a current Linux. Naming two exact types would have caught
          # the committed binary on one machine and not on the next. The separator is a class
          # of spaces because `file` aligns its columns.
          offenders=$(git ls-files -z \
            | xargs -0 file --mime-type 2>/dev/null \
            | grep -E ':[[:space:]]+application/.*(executable|octet-stream)' || true)
          if [ -n "$offenders" ]; then
            echo "these tracked files are compiled artefacts rather than source:"
            echo "$offenders"
            exit 1
          fi

      - name: Every Go file is one the toolchain compiles
        # A file whose package clause does not match its directory's is not an error: Go lists
        # it under IgnoredGoFiles and carries on, so the build passes and the file has never
        # run. The documentation subsystem's docs_embed.go declared `package documentation` in
        # a package called `docs` and was skipped for its whole life, which is how a subsystem
        # whose only job is serving documentation served nothing at all.
        run: make check-repo

      - name: go.mod files are tidy
        run: |
          # A module that does not build on its own is not an independent project, and the
          # usual cause is a requirement that was added to the workspace and never to the
          # module.
          for module in . cmd/toolbox subsystems/*/; do
            if [ -f "$module/go.mod" ]; then
              ( cd "$module" && GOWORK=off go mod tidy && git diff --quiet -- go.mod go.sum || {
                echo "$module/go.mod is not tidy; run 'go mod tidy' in it"; exit 1; } )
            fi
          done
